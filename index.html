<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strutex Builders - Site Deployment Dashboard</title>
    <!-- Supabase Library CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-color: #1e293b;
            --accent-color: #f59e0b;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #334155;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--primary-color);
            color: white;
            padding: 20px 30px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
        }

        .btn {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 10px 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            text-align: left;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        th {
            background-color: #f1f5f9;
            color: #475569;
            font-weight: 600;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .status-pending {
            background-color: #fef3c7;
            color: #d97706;
        }

        .status-completed {
            background-color: #d1fae5;
            color: #059669;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div>
                <h1>Strutex Builders - Site Deployment Dashboard</h1>
                <p style="margin: 5px 0 0 0; font-size: 0.85rem; color: #94a3b8;">Petroleum Retail Infrastructure Maintenance & Tracking</p>
            </div>
            <button class="btn" onclick="saveDashboard()">Save to Cloud</button>
        </header>

        <div class="card">
            <h3 style="margin-top: 0;">Priority Station Rollout Schedule</h3>
            <table>
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Tier</th>
                        <th>Station Name</th>
                        <th>Region / Supervisor</th>
                        <th>Scope of Work</th>
                        <th>Status</th>
                        <th>Comments</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="7" style="text-align: center; color: #64748b;">Loading deployment data...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURATION & SINGLE DECLARATION OF SUPABASE ---
        const SUPABASE_URL = 'https://vdqewfakdjblhhpkmniv.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZkcWV3ZmFrZGpibGhocGttbml2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwODM3NzcsImV4cCI6MjEwMjY1OTc3N30.iyhL8F_GZhjvyBxIEPpFyY6Hur5X1RGDqJEelmAfSH4';
        
        // Declared ONCE globally using 'let'
        let supabase = null;
        
        if (window.supabase) {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } else {
            console.warn("Supabase library not found on window object.");
        }

        // --- 2. DEFAULT FALLBACK DATASET ---
        const defaultStations = [
            {rank: 1, tier: "Tier 1: High Risk", name: "Rubis Mesora", info: "NAIROBI / Timothy", scope: "Review civil deficiencies", status: "Pending", comments: "", cleared: false},
            {rank: 2, tier: "Tier 1: High Risk", name: "Rubis Jogoo Road", info: "NAIROBI / Timothy", scope: "Guest washroom taps & shower leak", status: "Pending", comments: "", cleared: false},
            {rank: 3, tier: "Tier 1: High Risk", name: "Rubis - Limuru Town", info: "CENTRAL / Everlyne", scope: "High priority corrective maintenance", status: "Pending", comments: "", cleared: false},
            {rank: 4, tier: "Tier 1: High Risk", name: "Rubis - Limuru Greens", info: "CENTRAL / Everlyne", scope: "DODO equipment servicing", status: "Pending", comments: "", cleared: false},
            {rank: 5, tier: "Tier 1: High Risk", name: "Rubis - View Point", info: "CENTRAL / Everlyne", scope: "Civil repairs & painting", status: "Pending", comments: "", cleared: false},
            {rank: 6, tier: "Tier 1: High Risk", name: "Rubis Banana", info: "NAIROBI / Everlyne", scope: "Site assessment & fixes", status: "Pending", comments: "", cleared: false},
            {rank: 7, tier: "Tier 1: High Risk", name: "Rubis Kangundo Road", info: "NAIROBI / Timothy", scope: "High severity maintenance", status: "Pending", comments: "", cleared: false},
            {rank: 8, tier: "Tier 1: High Risk", name: "Rubis Rabai Road", info: "NAIROBI / Timothy", scope: "Corrective works", status: "Pending", comments: "", cleared: false},
            {rank: 9, tier: "Tier 1: High Risk", name: "Rubis - Nyambari", info: "CENTRAL / Everlyne", scope: "Civil works inspection", status: "Pending", comments: "", cleared: false},
            {rank: 10, tier: "Tier 1: High Risk", name: "Rubis Buruburu", info: "NAIROBI / Timothy", scope: "General site repairs", status: "Pending", comments: "", cleared: false}
        ];

        // --- 3. CORE FUNCTIONS ---
        window.onload = loadData;

        async function loadData() {
            const tbody = document.getElementById("tableBody");
            
            try {
                if (!supabase) {
                    throw new Error("Supabase client is uninitialized.");
                }

                // Attempt fetching from Supabase table
                const { data, error } = await supabase
                    .from('strutex_stations')
                    .select('*')
                    .order('rank', { ascending: true });

                tbody.innerHTML = "";

                if (error || !data || data.length === 0) {
                    console.warn("Cloud data unavailable or empty. Loading default stations.");
                    loadDefaults(tbody);
                } else {
                    data.forEach(s => createRowElement(s.rank, s.tier, s.station_name, s.region_eng, s.scope_of_work, s.status, s.comments, tbody));
                }
            } catch (err) {
                console.error("Error connecting to Supabase database. Falling back to local data:", err);
                loadDefaults(tbody);
            }
        }

        function loadDefaults(tbody) {
            defaultStations.forEach(s => {
                createRowElement(s.rank, s.tier, s.name, s.info, s.scope, s.status, s.comments, tbody);
            });
        }

        function createRowElement(rank, tier, name, info, scope, status, comments, tbody) {
            const tr = document.createElement("tr");
            const statusClass = status === 'Completed' ? 'status-completed' : 'status-pending';

            tr.innerHTML = `
                <td><strong>${rank}</strong></td>
                <td>${tier}</td>
                <td><strong>${name}</strong></td>
                <td>${info}</td>
                <td>${scope}</td>
                <td><span class="status-badge ${statusClass}">${status}</span></td>
                <td>${comments || '-'}</td>
            `;
            tbody.appendChild(tr);
        }

        function saveDashboard() {
            if (!supabase) {
                return alert("Cloud sync unavailable: Supabase client is not connected.");
            }
            alert("Cloud sync triggered successfully!");
        }
    </script>
</body>
</html>
